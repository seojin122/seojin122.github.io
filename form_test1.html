<!DOCTYPE html>
<html>
  <head>
    <title>Form 테스트2</title>
    <style>
      h3 {
        text-align: center;
      }
      .container {
        display: flex;
        justify-content: center;
        margin: 10px;
        padding: 10px;
      }
      #job_form {
        background-color: #f9f9a9;
        width: 320px;
        margin: 10px;
        padding: 10px;
      }
    </style>
    <script>
      function submitJobForm(event) {
        event.preventDefault();

        const email = document.getElementById("job_email").value;
        const name = document.getElementById("job_name").value;
        const message = document.getElementById("job_message").value;


        fetch("https://script.google.com/macros/s/AKfycbyFmdFoZbZJqmH-8cqbqNKIs-WjgMZ5V-9Cr-BrbEBMqyfyRdLllnJWEYOcAJWwwSzkKQ/exec", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: `email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}&message=${encodeURIComponent(message)}`
        }).then(() => {
          alert("제출되었습니다! 응원합니다 :)");
        }).catch(error => {
          alert("전송 실패: " + error.message);
        });
      }
    </script>
  </head>
  <body>
    <h3>취업 준비 설문</h3>
    <div class="container">
      <div id="job_form">
        <form id="job_form_id" name="job_form_name" onsubmit="submitJobForm(event)">
          <fieldset>
            <legend>취업 준비 중인 당신</legend>

            <label>이메일:<br>
              <input type="email" id="job_email" name="email" placeholder="id@domain.com" required>
            </label><br><br>

            <label>이름:<br>
              <input type="text" id="job_name" name="name" placeholder="홍길동" required>
            </label><br><br>

            <label>자기소개 또는 현재 상황:<br>
              <textarea id="job_message" name="message" rows="4" placeholder="간단히 적어주세요" required></textarea>
            </label><br><br>

            <button type="submit">제출하기</button>
          </fieldset>
        </form>
      </div>
    </div>
  </body>
</html>
